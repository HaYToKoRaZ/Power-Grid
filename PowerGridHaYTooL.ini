; ==============================================================================
; Power Grid HaYTooL - Yapılandırma Dosyası / Configuration File
; ==============================================================================
; Bu dosya uygulamanın temel çalışma ve otomasyon ayarlarını içerir.
; This file contains the core operational and automation settings of the application.
; ==============================================================================

[Main]
; [TR] Dil Seçimi: Auto (Windows sistem dilini otomatik algılar), Turkish veya English
; [EN] Language: Auto (Automatically detects Windows system language), Turkish, or English
; Varsayılan / Default: Auto
Language=Auto

; [TR] Görsel Tema: Auto (Windows açık/koyu modunu izler), SunsetBoulevard, BotanicalGarden,
;      NordicSlateNavy, ObsidianBlack, SilverBlue, OceanDepths, MidnightGalaxy, TechInnovation,
;      ForestCanopy, ArcticFrost, DesertRose, GoldenHour, ModernMinimalist
; [EN] Theme: Auto (Follows Windows light/dark mode) or one of the theme names above.
; Varsayılan / Default: Auto
Theme=Auto

; [TR] Sistem Tepsisi: 1 = Bildirim alanında (saatin yanında) simge göster, 0 = Gösterme
; [EN] System Tray: 1 = Show tray icon next to the clock, 0 = Do not show
; Varsayılan / Default: 0
ShowSystemTray=0

; [TR] Her Zaman Üstte: 1 = Pencere diğer pencerelerin üzerinde kalsın, 0 = Normal
; [EN] Always On Top: 1 = Keep application window on top of others, 0 = Normal
; Varsayılan / Default: 0
AlwaysOnTop=0

; [TR] Küçültüldüğünde Gizle: 1 = Pencere küçültüldüğünde görev çubuğundan gizlenip tepsiye geçsin, 0 = Normal
; [EN] Hide When Minimized: 1 = Hide from taskbar into tray when minimized, 0 = Normal
; Varsayılan / Default: 1
HideWhenMinimized=1

; [TR] Kapatıldığında Tepsiye Küçült: 1 = 'X' kapatma butonuna basıldığında arka planda çalışmaya devam etsin, 0 = Çıkış yap
; [EN] Close To Tray: 1 = Minimize to system tray when 'X' is clicked, 0 = Exit application
; Varsayılan / Default: 1
CloseToTray=1

; [TR] Windows Başlangıcında Çalıştır: 1 = Bilgisayar açıldığında otomatik başlasın, 0 = Başlamasın
; [EN] Start With Windows: 1 = Launch automatically on Windows startup, 0 = Do not launch
; Varsayılan / Default: 0
AutoStart=0

; [TR] Kullanıcı Oturum Açılış Güç Planı GUID'i (Boş bırakılırsa Windows varsayılanını kullanır)
; [EN] User Startup Power Plan GUID (Leave empty to use Windows default)
; Varsayılan / Default: (boş / empty)
UserStartupPlanGuid=

; [TR] Kullanıcı Oturum Açılış Güç Planı Adı
; [EN] User Startup Power Plan Name
; Varsayılan / Default: (boş / empty)
UserStartupPlanName=


[SmartSwitch]
; [TR] Akıllı GPU Otomatik Güç Anahtarı: 1 = Etkin, 0 = Devre Dışı
; [EN] Smart GPU Auto Power Switch: 1 = Enabled, 0 = Disabled
; Varsayılan / Default: 0
Enabled=0

; [TR] 1. Kademe: Düşük Kullanım Güç Planı GUID'i (0-%10 arası boşta/ofis modu)
; [EN] Tier 1: Low / Idle Power Plan GUID (0-10% GPU load)
; Varsayılan / Default: (boş / empty)
LowPlanGuid=

; [TR] 2. Kademe: Orta Kullanım Güç Planı GUID'i (%10-%30 arası video/tarayıcı modu)
; [EN] Tier 2: Medium Power Plan GUID (10-30% GPU load)
; Varsayılan / Default: (boş / empty)
MediumPlanGuid=

; [TR] 3. Kademe: Yüksek/Oyun Güç Planı GUID'i (%30-%100 arası oyun/render modu)
; [EN] Tier 3: High / Gaming Power Plan GUID (30-100% GPU load)
; Varsayılan / Default: (boş / empty)
HighPlanGuid=

; [TR] Düşük-Orta Eşik Değeri (Yüzde olarak GPU kullanımı, örn: 10)
; [EN] Low-Medium Threshold (GPU usage percentage, e.g. 10)
; Varsayılan / Default: 10
LowThreshold=10

; [TR] Orta-Yüksek Eşik Değeri (Yüzde olarak GPU kullanımı, örn: 30)
; [EN] Medium-High Threshold (GPU usage percentage, e.g. 30)
; Varsayılan / Default: 30
HighThreshold=30

; [TR] Plan Değişim Tetikleme Süresi (Saniye): GPU eşiği aştığında bu kadar saniye sonra plana geç
; [EN] Trigger Delay (Seconds): Switch to higher plan after load exceeds threshold for this duration
; Varsayılan / Default: 3
TriggerSeconds=3

; [TR] Normale Dönüş Süresi (Saniye): GPU kullanımı düştüğünde ani dalgalanmayı önlemek için bekleme süresi
; [EN] Revert Delay (Seconds): Switch to lower plan after load drops below threshold for this duration
; Varsayılan / Default: 8
RevertSeconds=8

; [TR] Bildirim Göster: 1 = Güç modu otomatik değiştiğinde sağ altta toast bildirim göster, 0 = Gösterme
; [EN] Show Notification: 1 = Show toast notification on plan change, 0 = Silent
; Varsayılan / Default: 1
ShowNotification=1
